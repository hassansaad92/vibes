<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vibes{% endblock %} — Machine Health Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-full">
    <nav class="border-b border-gray-800 bg-gray-900 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <span class="text-base font-bold text-white tracking-tight">Vibes</span>
        </div>
    </nav>
    <main class="max-w-5xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
